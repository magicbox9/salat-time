server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    resolver 127.0.0.11 valid=10s ipv6=off;
    index index.php index.html;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and fonts have hashed or fixed names: cache them for a long time.
    location ~* ^/(build|fonts)/ {
        types {
            application/javascript js;
            text/css css;
            font/ttf ttf;
            font/woff2 woff2;
            font/woff woff;
            image/svg+xml svg;
            image/png png;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /storage/ {
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Resolved per request (Docker DNS), so recreating the app container never leaves a stale address.
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
