# Salat Time Web — server stack.
# The same file runs locally (Docker on the Mac) and later in production.
# Settings come from .env (see .env.example); only that file changes between the two.

name: salat-time-web

x-php: &php
  build:
    context: ./docker/php
  image: salat-time/web-app:dev
  restart: unless-stopped
  volumes:
    - .:/var/www/html
    # Read-only research data used by `php artisan mosques:import` (dev only).
    - ${STUDIES_PATH:-../Prayer Times Study}:/data/studies:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [salat]

services:

  # Web server — public entry point
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${WEB_PORT:-8095}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [salat]

  # Application server — PHP 8.4 FPM running Laravel
  app:
    <<: *php

  # Background jobs — emails, imports
  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300", "--sleep=1"]

  # Scheduled tasks (Laravel scheduler)
  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  # Database — PostgreSQL 17
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "jit=off"]
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_DATABASE:-salat}
      # Superuser: database setup only. The app connects as DB_USERNAME.
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-salat}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-salat_dev_password}
      APP_DB_USERNAME: ${DB_USERNAME:-salat_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-salat_app_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USERNAME:-salat} -d ${DB_DATABASE:-salat}"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [salat]

  # Cache, sessions and queues — Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [salat]

  # ---- Dev-only tools (not deployed to production) ----

  # Fake email inbox — catches every email the app sends
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8026}:8025"
    networks: [salat]

  # Database browser
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8086}:8080"
    networks: [salat]

volumes:
  db_data:
  redis_data:

networks:
  salat:
    name: salat-web-net
